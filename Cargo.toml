[package]
name = "gh-activity-report"
version = "0.3.0"
edition = "2024"
description = "Generate pull-request-focused standup reports from recent GitHub activity"
license = "MIT"
repository = "https://github.com/bwestlin/gh-activity-report"
homepage = "https://github.com/bwestlin/gh-activity-report"
readme = "README.md"
keywords = ["github", "activity", "standup", "cli", "report"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
open = "5.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.27"
urlencoding = "2.1"

[dev-dependencies]
pretty_assertions = "1.4"

